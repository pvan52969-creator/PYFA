name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/pkgl
      - feature/add-login
      - preview

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # checkout 默认只拉触发分支；多分支站点必须显式 fetch
      - name: Fetch publish branches
        run: git fetch --no-tags origin main feature/pkgl feature/add-login preview

      - name: Build Pages
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          # 只发布 prototype/ 内容到对应路径，并去掉 node_modules
          publish_branch() {
            local ref="$1"
            local dest="$2"
            mkdir -p "$dest"
            git archive "$ref:prototype" | tar -x -C "$dest"
            rm -rf "$dest/node_modules"
          }

          # main → 网站根目录
          publish_branch origin/main site

          # feature/pkgl → /feature/pkgl/
          publish_branch origin/feature/pkgl site/feature/pkgl

          # feature/add-login → /feature/add-login/
          publish_branch origin/feature/add-login site/feature/add-login

          # preview → /preview/
          publish_branch origin/preview site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
