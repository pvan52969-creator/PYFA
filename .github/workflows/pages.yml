name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/pkgl
      - feature/add-login
      - preview

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Pages
        run: |
          rm -rf site
          mkdir -p site

          # main → 网站根目录
          git archive origin/main | tar -x -C site

          # feature/pkgl → /feature/pkgl/
          mkdir -p site/feature/pkgl
          git archive origin/feature/pkgl | tar -x -C site/feature/pkgl

          # feature/add-login → /feature/add-login/
          mkdir -p site/feature/add-login
          git archive origin/feature/add-login | tar -x -C site/feature/add-login

          # preview → /preview/
          mkdir -p site/preview
          git archive origin/preview | tar -x -C site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4